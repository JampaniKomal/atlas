[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-edna"
dynamic = ["version"]
description = "Taxonomy and biodiversity from environmental DNA: deep-learning classifiers for known taxa, unsupervised discovery of the rest."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jampani Komal" }, { name = "Rishu Tiwari" }]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.3",
  "tensorflow>=2.16",
  "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.dynamic]
version = { attr = "atlas.__version__" }

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
"atlas.web" = ["index.html"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"atlas/report.py" = ["E501"]  # HTML template
